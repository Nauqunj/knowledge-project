name: Daily Collect

on:
  schedule:
    # UTC 08:00 == Asia/Shanghai 16:00
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, analyze and organize
    runs-on: ubuntu-latest
    env:
      # Default token is used for the GitHub Search API (higher rate limit) and for the push.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline/pipeline.py --sources github,rss --limit 20

      - name: Detect new articles
        id: changes
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          shopt -s nullglob
          files=(knowledge/articles/"${DATE}"-*.json)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate article JSON
        if: steps.changes.outputs.count != '0'
        run: >-
          python hooks/validate_json.py
          "knowledge/articles/${{ steps.changes.outputs.date }}-*.json"

      - name: Check article quality
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: >-
          python hooks/check_quality.py
          "knowledge/articles/${{ steps.changes.outputs.date }}-*.json"

      - name: Commit and push new articles
        if: steps.changes.outputs.count != '0'
        env:
          DATE: ${{ steps.changes.outputs.date }}
          COUNT: ${{ steps.changes.outputs.count }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: collect ${DATE} articles (${COUNT} new)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"

      - name: Nothing to commit
        if: steps.changes.outputs.count == '0'
        run: echo "No new articles collected; skipping commit."
